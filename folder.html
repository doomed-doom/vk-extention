<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Папка для фото VK</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --border: #dce1e6;
        --button-bg: #f2f3f5;
        --button-bg-hover: #e5e7eb;
        --muted: #626d7a;
        --text: #19191a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --border: #3f4043;
          --button-bg: #232324;
          --button-bg-hover: #2c2d2f;
          --muted: #939599;
          --text: #e1e3e6;
        }
      }

      body {
        background: var(--bg);
        box-sizing: border-box;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        max-width: 520px;
        padding: 24px;
      }

      h1 {
        font-size: 20px;
        margin: 0 0 18px;
      }

      button {
        background: var(--button-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        min-height: 40px;
        padding: 8px 12px;
      }

      button:hover {
        background: var(--button-bg-hover);
      }

      #folder-name {
        font-size: 16px;
        font-weight: 700;
        margin-top: 14px;
      }

      #status,
      .hint {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.45;
        margin-top: 10px;
      }

      #grant-access[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>Папка для фото</h1>
    <button id="choose-folder" type="button">Выбрать папку</button>
    <button id="grant-access" type="button" hidden>Возобновить доступ</button>
    <div id="folder-name"></div>
    <div class="hint">Оставь эту вкладку открытой, пока скачиваешь фото из VK.</div>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="folder.js"></script>
  </body>
</html>
