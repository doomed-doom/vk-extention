<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VK Photo Extention</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --border: #dce1e6;
        --button-bg: #f2f3f5;
        --button-bg-hover: #e5e7eb;
        --muted: #626d7a;
        --text: #19191a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --border: #3f4043;
          --button-bg: #232324;
          --button-bg-hover: #2c2d2f;
          --muted: #939599;
          --text: #e1e3e6;
        }
      }

      body {
        background: var(--bg);
        box-sizing: border-box;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 16px;
        line-height: 1.5;
        margin: 48px auto;
        padding: 24px;
        max-width: 600px;
      }

      h1 {
        display: block;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      button {
        background: var(--button-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-sizing: border-box;
        color: var(--text);
        font: inherit;
        min-height: 38px;
        padding: 8px 10px;
        width: 100%;
        cursor: pointer;
        margin-top: 8px;
        text-align: center;
      }

      button:hover {
        background: var(--button-bg-hover);
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      #status,
      .hint {
        color: var(--muted);
        font-size: 16px;
        overflow-wrap: anywhere;
      }

      #status {
        background: var(--button-bg);
        border-left: 4px solid #0077ff;
        border-radius: 8px;
        color: var(--text);
        font-size: 18px;
        font-weight: 700;
        line-height: 1.5;
        margin-top: 16px;
        padding: 14px 16px;
      }

      #status:empty { display: none; }

      .hint {
        margin-top: 8px;
      }

      .save-options { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; cursor: pointer; }
      .save-options input { margin: 0; accent-color: #0077ff; }

      body.gallery-page { max-width: 1160px; margin: 32px auto; padding: 0 32px 32px; }
      .gallery-page h1 { font-size: 24px; line-height: 1.3; margin: 0 0 8px; }
      .gallery-page #summary { color: var(--muted); margin: 0; overflow-wrap: anywhere; }
      .gallery-page .save-controls { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 12px; margin-top: 24px; }
      .gallery-page .save-options { margin: 0; font-size: 14px; }
      .gallery-page button { width: auto; margin: 0; min-height: 40px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
      .gallery-page #save-photos:not(:disabled) { background: #0064d9; border-color: #0064d9; color: #fff; }
      .gallery-page #save-photos:not(:disabled):hover { background: #0054b8; border-color: #0054b8; }
      .gallery-page .hint { font-size: 13px; margin: 10px 0 0; }
      .gallery-page #status { font-size: 14px; font-weight: 400; border-radius: 4px; border-left-width: 3px; padding: 10px 14px; margin-top: 16px; }
      .gallery-page input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; margin: 0; accent-color: #0077ff; cursor: pointer; }
      .gallery-page :is(button, select, input):focus-visible { outline: 2px solid #0077ff; outline-offset: 3px; }
      .gallery-toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 24px 0; padding: 16px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 14px; }
      .gallery-toolbar label { display: flex; align-items: center; gap: 10px; }
      .gallery-toolbar label:nth-child(2) { margin-left: auto; color: var(--muted); }
      select { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; min-height: 40px; padding: 8px 10px; max-width: 100%; }
      #retry { width: auto; margin: 0; }
      .photo-day { margin-bottom: 32px; }
      .photo-day-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
      .photo-day-header h2 { font-size: 16px; font-weight: 600; line-height: 1.5; margin: 0; }
      .photo-day-header label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
      .day-count { color: var(--muted); font-size: 13px; margin-left: auto; }
      .day-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 16px; }
      .attachment { display: flex; flex-direction: column; min-width: 0; position: relative; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; cursor: pointer; transition: border-color .15s, background-color .15s; }
      .attachment:hover { border-color: var(--muted); }
      .attachment:has(input:checked) { border-color: #0077ff; background: var(--button-bg); box-shadow: inset 0 0 0 1px #0077ff; }
      .attachment:has(input:focus-visible) { outline: 2px solid #0077ff; outline-offset: 2px; }
      .attachment input { position: absolute; z-index: 1; top: 10px; left: 10px; outline: 3px solid var(--bg); border-radius: 2px; }
      .attachment-preview { width: 100%; aspect-ratio: 4 / 3; flex-shrink: 0; object-fit: contain; display: block; background: var(--button-bg); }
      .attachment-placeholder { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 16px; }
      .attachment-name { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 10px 12px 4px; min-height: 42px; overflow-wrap: anywhere; font-size: 14px; line-height: 21px; font-weight: 500; }
      .attachment-date { display: block; padding: 0 12px 12px; margin-top: auto; min-height: 39px; font-size: 13px; line-height: 1.5; color: var(--muted); overflow-wrap: anywhere; }
      @media (max-width: 760px) {
        body.gallery-page { margin: 24px auto; padding: 0 16px 24px; }
        .gallery-page .save-controls { grid-template-columns: minmax(0, 1fr) auto; }
        .gallery-page .save-options { grid-column: 1 / -1; margin-bottom: 4px; }
        .gallery-toolbar { gap: 12px; }
        .day-photos { grid-template-columns: repeat(auto-fill, minmax(min(100%, 145px), 1fr)); gap: 12px; }
      }
      @media (max-width: 420px) {
        .gallery-page .save-controls { grid-template-columns: minmax(0, 1fr); gap: 10px; }
        .gallery-toolbar label:nth-child(2) { margin-left: 0; }
        .gallery-toolbar label:nth-child(2) select { flex: 1; min-width: 0; }
        .gallery-toolbar label:nth-child(2) { width: 100%; }
        .photo-day-header { gap: 8px; }
      }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Сохранение фотографий VK</h1>
    <p id="summary">Выделите сообщения с фотографиями в VK и нажмите «Скачать фотографии».</p>
    <div class="save-controls">
      <label class="save-options"><input id="chat-subfolder" type="checkbox" checked> Создать подпапку для чата</label>
      <button id="save-photos" type="button" disabled>Выбрать папку и сохранить</button>
      <button id="save-zip" type="button" disabled>Сохранить ZIP</button>
    </div>
    <p class="hint">Не закрывайте эту вкладку до завершения сохранения.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="gallery-controls" class="gallery-toolbar" hidden>
      <label><input id="select-all" type="checkbox"> Выбрать все</label>
      <label>По дате <select id="sort-order"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option></select></label>
      <button id="retry" type="button" hidden>Повторить загрузку</button>
    </div>
    <div id="gallery" hidden></div>
    <script src="zip.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
