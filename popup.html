<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>VK Photo Extention</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --border: #dce1e6;
        --button-bg: #f2f3f5;
        --button-bg-hover: #e5e7eb;
        --muted: #626d7a;
        --text: #19191a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --border: #3f4043;
          --button-bg: #232324;
          --button-bg-hover: #2c2d2f;
          --muted: #939599;
          --text: #e1e3e6;
        }
      }

      body {
        background: var(--bg);
        box-sizing: border-box;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px;
        width: 300px;
      }

      label {
        display: block;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      input,
      button {
        background: var(--button-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-sizing: border-box;
        color: var(--text);
        font: inherit;
        min-height: 38px;
        padding: 8px 10px;
        width: 100%;
      }

      input {
        color: var(--text);
        font: inherit;
      }

      button {
        cursor: pointer;
        margin-top: 8px;
        text-align: center;
      }

      button:hover {
        background: var(--button-bg-hover);
      }

      #download-folder {
        font-size: 15px;
        font-weight: 700;
      }

      #status,
      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      #status {
        margin-top: 8px;
        min-height: 16px;
      }

      .hint {
        margin-top: 8px;
      }

    </style>
  </head>
  <body>
    <label for="download-folder">Настройки</label>
    <input id="download-folder" type="text" value="VK Photos" placeholder="VK Photos" autocomplete="off">
    <button id="save-folder" type="button">Сохранить</button>
    <div class="hint">Укажите папку или путь относительно папки загрузок браузера.</div>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
