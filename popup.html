<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VK Photo Extention</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --border: #dce1e6;
        --button-bg: #f2f3f5;
        --button-bg-hover: #e5e7eb;
        --muted: #626d7a;
        --text: #19191a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --border: #3f4043;
          --button-bg: #232324;
          --button-bg-hover: #2c2d2f;
          --muted: #939599;
          --text: #e1e3e6;
        }
      }

      body {
        background: var(--bg);
        box-sizing: border-box;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 48px auto;
        padding: 24px;
        max-width: 600px;
      }

      h1 {
        display: block;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      button {
        background: var(--button-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-sizing: border-box;
        color: var(--text);
        font: inherit;
        min-height: 38px;
        padding: 8px 10px;
        width: 100%;
        cursor: pointer;
        margin-top: 8px;
        text-align: center;
      }

      button:hover {
        background: var(--button-bg-hover);
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      #status,
      .hint {
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      #status {
        background: var(--button-bg);
        border-left: 4px solid #0077ff;
        border-radius: 8px;
        color: var(--text);
        font-size: 16px;
        font-weight: 700;
        line-height: 1.5;
        margin-top: 16px;
        padding: 14px 16px;
      }

      #status:empty { display: none; }

      .hint {
        margin-top: 8px;
      }

      body.gallery-page { max-width: 1100px; margin-top: 24px; }
      .gallery-page h1 { font-size: 24px; }
      .gallery-toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin: 24px 0 16px; }
      select { font: inherit; color: var(--text); background: var(--button-bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
      #retry { width: auto; margin: 0; }
      .photo-day { margin-bottom: 28px; }
      .photo-day-header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      .photo-day-header h2 { font-size: 16px; font-weight: 600; margin: 0; }
      .photo-day-header label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .day-select { width: 18px; height: 18px; margin: 0; accent-color: #0077ff; }
      .day-count { color: var(--muted); font-size: 13px; margin-right: auto; }
      .day-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; }
      .attachment { position: relative; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; transition: border-color .15s, background-color .15s; }
      .attachment:hover { background: var(--button-bg); }
      .attachment:has(input:checked) { border-color: #0077ff; background: var(--button-bg); }
      .attachment:has(input:focus-visible) { outline: 2px solid #0077ff; outline-offset: 2px; }
      .attachment input { position: absolute; top: 10px; left: 10px; width: 20px; height: 20px; accent-color: #0077ff; }
      .attachment-preview { width: 100%; height: 160px; object-fit: cover; display: block; background: var(--button-bg); }
      .attachment-placeholder { display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; }
      .attachment-name { display: block; padding: 12px 12px 4px; overflow-wrap: anywhere; font-size: 14px; }
      .attachment-date { display: block; padding: 0 12px 12px; font-size: 12px; color: var(--muted); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Сохранение фотографий VK</h1>
    <p id="summary">Выделите сообщения с фотографиями в VK и нажмите «Скачать фотографии».</p>
    <button id="save-photos" type="button" disabled>Выбрать папку и сохранить</button>
    <button id="save-zip" type="button" disabled>Сохранить ZIP</button>
    <p class="hint">Сохраните фотографии в подпапку чата или одним ZIP-архивом. Не закрывайте эту вкладку до завершения.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <div id="gallery-controls" class="gallery-toolbar" hidden>
      <label><input id="select-all" type="checkbox"> Выбрать все</label>
      <label>По дате <select id="sort-order"><option value="newest">Сначала новые</option><option value="oldest">Сначала старые</option></select></label>
      <button id="retry" type="button" hidden>Повторить загрузку</button>
    </div>
    <div id="gallery" hidden></div>
    <script src="zip.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
