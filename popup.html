<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>VK Photo Extention</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --border: #dce1e6;
        --button-bg: #f2f3f5;
        --button-bg-hover: #e5e7eb;
        --muted: #626d7a;
        --text: #19191a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --border: #3f4043;
          --button-bg: #232324;
          --button-bg-hover: #2c2d2f;
          --muted: #939599;
          --text: #e1e3e6;
        }
      }

      body {
        background: var(--bg);
        box-sizing: border-box;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 48px auto;
        padding: 24px;
        max-width: 600px;
      }

      h1 {
        display: block;
        font-size: 15px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      button {
        background: var(--button-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-sizing: border-box;
        color: var(--text);
        font: inherit;
        min-height: 38px;
        padding: 8px 10px;
        width: 100%;
        cursor: pointer;
        margin-top: 8px;
        text-align: center;
      }

      button:hover {
        background: var(--button-bg-hover);
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      #status,
      .hint {
        color: var(--muted);
        font-size: 14px;
        overflow-wrap: anywhere;
      }

      #status {
        margin-top: 8px;
        min-height: 16px;
      }

      .hint {
        margin-top: 8px;
      }

    </style>
  </head>
  <body>
    <h1>Сохранение фотографий VK</h1>
    <p id="summary">Выделите сообщения с фотографиями в VK и нажмите «Скачать фотографии».</p>
    <button id="save-photos" type="button" disabled>Выбрать папку и сохранить</button>
    <p class="hint">Выберите папку на компьютере. Фотографии сохранятся в подпапке чата. Не закрывайте эту вкладку до завершения.</p>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
