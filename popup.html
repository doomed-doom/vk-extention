<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>VK Photo Extention</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --border: #dce1e6;
        --button-bg: #f2f3f5;
        --button-bg-hover: #e5e7eb;
        --muted: #626d7a;
        --text: #19191a;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #19191a;
          --border: #3f4043;
          --button-bg: #232324;
          --button-bg-hover: #2c2d2f;
          --muted: #939599;
          --text: #e1e3e6;
        }
      }

      body {
        background: var(--bg);
        box-sizing: border-box;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 14px;
        width: 300px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 8px;
      }

      button {
        background: var(--button-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font: inherit;
        min-height: 38px;
        padding: 8px 10px;
        text-align: left;
        width: 100%;
      }

      button:hover {
        background: var(--button-bg-hover);
      }

      #choose-folder {
        font-size: 15px;
        font-weight: 700;
      }

      #status,
      .hint {
        color: var(--muted);
        font-size: 12px;
      }

      .hint {
        margin-top: 8px;
      }

    </style>
  </head>
  <body>
    <label for="choose-folder">Папка для фото</label>
    <button id="choose-folder" type="button">Выбрать папку</button>
    <div class="hint">Оставь вкладку расширения открытой, чтобы сохранять фото в эту папку.</div>
    <script src="popup.js"></script>
  </body>
</html>
